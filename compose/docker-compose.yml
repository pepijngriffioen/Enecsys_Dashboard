services:
  app:
    image: local/enecsys-php:8.2
    ports:
      - "8080:80"
      - "5040:5040"
    volumes:
      - php_data:/var/www/html
    #   - ../docker/php/src/:/var/www/html
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: local/enecsys-mariadb:10.6
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
        - .env
    restart: unless-stopped
volumes:
  php_data:
  mariadb_data:
